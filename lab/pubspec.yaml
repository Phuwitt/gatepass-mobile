version: 1.0.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  mobile_scanner: 7.4.2
  flutter_secure_storage: 11.2.0
  intl: 0.20.3
dev_dependencies:
